[project]
name = "matchiq-core"
version = "0.1.0"
description = "Core ML and data pipeline for MatchIQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "rapidfuzz",
    "jellyfish",
    "phonenumbers",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "faker",
    "recordlinkage",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "python-multipart"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matchiq"]

[tool.ruff]
line-length = 100
